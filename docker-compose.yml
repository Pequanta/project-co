services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: project_co
      POSTGRES_PASSWORD: project_co
      POSTGRES_DB: project_co
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_co -d project_co"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
